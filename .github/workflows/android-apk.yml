# 构建并签名安卓 APK（壳），产物发到 GitHub Release。
#
# 触发：打 v* tag 或手动运行。
# 日常改网页**不需要**跑这个 —— 站点内容走 OTA 热更新（见 README §4）。
# 只有原生层变化（加/换插件、改权限、改包名/图标、升级 Capacitor 或 SDK）才需要重打。
#
# 需要仓库 Secrets（Settings → Secrets and variables → Actions）：
#   CK_KEYSTORE_B64        keystore 的 base64
#   CK_KEYSTORE_PASSWORD   storePassword
#   CK_KEY_PASSWORD        keyPassword（PKCS12 通常与 storePassword 相同）
#   CK_KEY_ALIAS           可选，默认 Ckarefulon
# 没配也能跑，但产物是 debug 签名，仅测试用。
#
# 注意：Actions 的**仓库级** Secret 是安全的（工作流可用、不可读、不进 fork）；
# 但 Codespaces 的**仓库级** Secret 对任何能开 Codespace 的人都可见 ——
# 本仓库是公开仓库，所以 Codespaces 那边必须用**个人** Secret，见
# docs/Codespaces云端构建.md。

name: Build Android APK

on:
  push:
    tags: ['v*']
    # 每次 push 到 main 都自动出一个 Release（用户要求「每次完成后发个 release」）。
    # 只动 docs/tests 时没必要出包，所以先按路径过滤；仍然可以手动触发强制出包。
    branches: [main]
    paths:
      - 'src/**'
      - 'shell/**'
      - 'assets/**'
      - 'android/**'
      - 'scripts/**'
      - 'app.config.json'
      - 'capacitor.config.json'
      - 'package.json'
      # 工作流自身的改动也要跑一次，否则改坏了没人知道
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本号（留空 = app.config.json 里的值），例如 1.1.0'
        required: false
        default: ''
      versionCode:
        description: 'versionCode 整数（留空 = 用 app.config.json 里的值）'
        required: false
        default: ''
      publishRelease:
        description: '是否发布到 GitHub Release'
        type: boolean
        default: true
      bumpVersion:
        description: 'push 触发时是否自增 versionCode（默认是；1.0.1 这种手填名字时留空即可）'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # v3 内部会 `sdkmanager tools`，而 Google 已经不再发布 tools 包，
      # 于是 setup 步骤直接挂：Failed to find package 'tools'（2026-11 实测）。
      # v4 把 tools 从默认 packages 里去掉了，其余内容都在 cmdline-tools 里。
      - name: Android SDK
        uses: android-actions/setup-android@v4

      # 与 android/variables.gradle 对齐；显式装，避免依赖 Gradle 的自动补装
      - name: 安装 Android SDK 组件
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # e2e 闸门（真浏览器进首页 + 断网进首页）以前因为找不到浏览器被静默跳过，
      # 看起来一切正常其实什么都没测。这里显式装一个并交给 CHROME_BIN。
      - name: 安装 Chrome（供 E2E 闸门使用）
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 恢复签名（Secrets）
        env:
          CK_KEYSTORE_B64: ${{ secrets.CK_KEYSTORE_B64 }}
          CK_KEYSTORE_PASSWORD: ${{ secrets.CK_KEYSTORE_PASSWORD }}
          CK_KEY_PASSWORD: ${{ secrets.CK_KEY_PASSWORD }}
          CK_KEY_ALIAS: ${{ secrets.CK_KEY_ALIAS }}
        run: |
          mkdir -p keys
          if [ -n "$CK_KEYSTORE_B64" ]; then
            printf '%s' "$CK_KEYSTORE_B64" | base64 -d > keys/Ckarefulon.keystore
            {
              echo "storeFile=../keys/Ckarefulon.keystore"
              echo "storePassword=$CK_KEYSTORE_PASSWORD"
              echo "keyAlias=${CK_KEY_ALIAS:-Ckarefulon}"
              echo "keyPassword=${CK_KEY_PASSWORD:-$CK_KEYSTORE_PASSWORD}"
              echo "storeType=PKCS12"
            } > keys/keystore.properties
            chmod 600 keys/keystore.properties keys/Ckarefulon.keystore
            echo "已恢复发布签名"
          else
            echo "::warning::未配置 CK_KEYSTORE_B64，release 包将回退 debug 签名（仅测试用）"
          fi

      # push 触发的自动出包：versionCode 自增（1.0.1+133、+134…），
      # 这样每次 Release 都是可覆盖升级的新版本号，不会出现"同一个 code 装不上去"。
      # tag 触发或显式传了 inputs 时以传入值为准。
      - name: 计算版本号
        id: ver
        run: |
          NAME="${{ inputs.versionName }}"
          CODE="${{ inputs.versionCode }}"
          if [ -z "$CODE" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              CODE="$(node -p "require('./app.config.json').versionCode")"
            else
              CODE="$(( $(node -p "require('./app.config.json').versionCode") + 1 ))"
            fi
          fi
          if [ -z "$NAME" ]; then NAME="$(node -p "require('./app.config.json').versionName")"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本次构建：$NAME / $CODE"

      - name: 同步壳 + 定制 Android 工程
        run: npm run android:sync && npm run android:patch

      # npm run apk 内部依次跑 utest → ptest → smoke → e2e → gradle，任一失败即阻断出包
      - name: 构建 APK（含全部质量闸门）
        env:
          CK_VERSION_NAME: ${{ steps.ver.outputs.name }}
          CK_VERSION_CODE: ${{ steps.ver.outputs.code }}
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run apk

      - name: 校验 APK
        # 必须带上同一份版本号：verify 会把 APK 里的 versionCode 和配置比，
        # 不带的话它拿 app.config.json 的旧值（132）去比构建出来的新值（133），
        # 报一条假的"versionCode 不匹配"。
        env:
          CK_VERSION_NAME: ${{ steps.ver.outputs.name }}
          CK_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: npm run verify

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ckarefulon-apk
          path: |
            dist/*.apk
            dist/apk-info.json
            dist/apk-verify.json
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: github.ref_type == 'tag' || inputs.publishRelease
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || format('apk-{0}-{1}', steps.ver.outputs.name, steps.ver.outputs.code) }}
          name: 'Ckarefulon ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})'
          artifacts: 'dist/*.apk'
          body: |
            安卓壳安装包（签名：Ckarefulon，versionCode ${{ steps.ver.outputs.code }}）。

            站点内容通过 OTA 自动更新，此 APK 仅在原生层（壳 JS / 插件 / 权限 / 图标）变化时
            才需要重新安装。签名未变（132 起为 4b164aa5…），可直接覆盖升级。

            构建提交：`${{ github.sha }}`
          allowUpdates: true
          prerelease: false
